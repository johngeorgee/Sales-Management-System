<!-- pages/Auth/Login/login.html -->
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-800">Vendora</h1>
      <p class="mt-1 text-sm text-slate-500">Sign in to your account</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:border-blue-500 focus:outline-none"
          required
        />
      </div>

      <!-- Password -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
        <div class="relative">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 pr-12 focus:border-blue-500 focus:outline-none"
            required
          />
          <button
            type="button"
            (click)="hidePassword = !hidePassword"
            class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
          >
           
          </button>
        </div>
      </div>

      <!-- Error Message -->
      @if (error || !email || !password) {
        <div class="rounded-lg bg-red-50 p-3 text-sm text-red-600">
          {{ error }}
        </div>
      }

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full rounded-lg bg-blue-600 px-5 py-3 font-medium text-white transition hover:bg-blue-700 disabled:opacity-50"
      >
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
