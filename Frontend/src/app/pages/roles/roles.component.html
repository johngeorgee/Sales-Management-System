<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Roles</h1>
      <p class="text-sm text-gray-500">Manage system roles and their permissions.</p>
    </div>
    <button mat-raised-button color="primary" (click)="addRole()" class="bg-indigo-600 hover:bg-indigo-700 text-white">
      <mat-icon>add</mat-icon>
      Add Role
    </button>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto">
    <table mat-table [dataSource]="roles" class="min-w-full" matSort>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Role</th>
        <td mat-cell *matCellDef="let role" class="px-4 py-2">
          <mat-chip color="primary" selected>{{role.name}}</mat-chip>
        </td>
      </ng-container>

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">ID</th>
        <td mat-cell *matCellDef="let role" class="px-4 py-2">{{role.id}}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Description</th>
        <td mat-cell *matCellDef="let role" class="px-4 py-2">{{role.description}}</td>
      </ng-container>

      <!-- Users Count Column -->
      <ng-container matColumnDef="usersCount">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Users</th>
        <td mat-cell *matCellDef="let role" class="px-4 py-2">{{role.usersCount}}</td>
      </ng-container>

      <!-- Permissions Count Column -->
      <ng-container matColumnDef="permissionsCount">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Permissions</th>
        <td mat-cell *matCellDef="let role" class="px-4 py-2">{{role.permissionsCount}}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Status</th>
        <td mat-cell *matCellDef="let role" class="px-4 py-2">
          <mat-chip [color]="role.status === 'Active' ? 'success' : 'warn'" selected>{{role.status}}</mat-chip>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Actions</th>
        <td mat-cell *matCellDef="let role" class="px-4 py-2 space-x-2">
          <button mat-icon-button color="primary" (click)="viewRole(role)" aria-label="View">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="editRole(role)" aria-label="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteRole(role)" aria-label="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="border-b"></tr>
    </table>
  </div>
</div>
