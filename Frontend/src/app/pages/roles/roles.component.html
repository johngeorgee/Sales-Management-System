<!-- roles.html -->
<div class="mx-auto max-w-7xl space-y-6">
  <!-- Header -->
  <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
    <div>
      <h1 class="text-3xl font-bold text-slate-800">Roles</h1>
      <p class="mt-1 text-sm text-slate-500">Manage system roles and their permissions.</p>
    </div>
    <button
      (click)="addRole()"
      class="rounded-xl bg-blue-600 px-5 py-3 font-medium text-white transition hover:bg-blue-700">
      + Add Role
    </button>
  </div>

  <!-- Table -->
  <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="overflow-x-auto">
      <table class="min-w-full">
        <thead class="bg-slate-50">
          <tr>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Role</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">ID</th>
            <th class="px-6 py-4 text-left text-sm font-semibold text-slate-600">Description</th>
            <th class="px-6 py-4 text-center text-sm font-semibold text-slate-600">Users</th>
            <th class="px-6 py-4 text-center text-sm font-semibold text-slate-600">Permissions</th>
            <th class="px-6 py-4 text-center text-sm font-semibold text-slate-600">Status</th>
            <th class="px-6 py-4 text-center text-sm font-semibold text-slate-600">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for(role of roles; track role.id) {
            <tr class="border-t transition hover:bg-slate-50">
              <!-- Role Name -->
              <td class="px-6 py-4">
                <span class="rounded-full bg-blue-100 px-3 py-1 text-xs font-medium text-blue-700">
                  {{ role.name }}
                </span>
              </td>

              <!-- ID -->
              <td class="px-6 py-4 font-mono text-sm text-slate-500">{{ role.id }}</td>

              <!-- Description -->
              <td class="px-6 py-4 text-slate-600">{{ role.description }}</td>

              <!-- Users Count -->
              <td class="px-6 py-4 text-center">
                <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-700">
                  {{ role.usersCount }}
                </span>
              </td>

              <!-- Permissions Count -->
              <td class="px-6 py-4 text-center">
                <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-700">
                  {{ role.permissionsCount }}
                </span>
              </td>

              <!-- Status -->
              <td class="px-6 py-4 text-center">
                <span
                  class="rounded-full px-3 py-1 text-xs font-semibold"
                  [ngClass]="{
                    'bg-green-100 text-green-800': role.status === 'Active',
                    'bg-red-100 text-red-700': role.status === 'Inactive'
                  }">
                  {{ role.status }}
                </span>
              </td>

              <!-- Actions -->
              <td class="px-6 py-4">
                <div class="flex justify-center gap-2">
                  <button
                    (click)="viewRole(role)"
                    class="rounded-lg bg-slate-100 px-3 py-1 text-sm hover:bg-slate-200">
                    View
                  </button>
                  <button
                    (click)="editRole(role)"
                    class="rounded-lg bg-blue-100 px-3 py-1 text-sm text-blue-700 hover:bg-blue-200">
                    Edit
                  </button>
                  <button
                    (click)="deleteRole(role)"
                    class="rounded-lg bg-red-100 px-3 py-1 text-sm text-red-700 hover:bg-red-200">
                    Delete
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <!-- Total Count -->
    <div class="flex items-center justify-between border-t px-6 py-4">
      <p class="text-sm text-slate-500">
        Total Roles :
        <span class="font-semibold">{{ roles.length }}</span>
      </p>
    </div>
  </div>
</div>
