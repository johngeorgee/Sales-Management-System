<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">{{role?.name}} Details</h1>
      <p class="text-sm text-gray-500">{{role?.description}}</p>
    </div>
    <mat-chip [color]="role?.status === 'Active' ? 'success' : 'warn'" selected>
      {{role?.status}}
    </mat-chip>
  </div>

  <!-- Users Assigned -->
  <section class="mb-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-2">Assigned Users</h2>
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="role?.users || []" class="min-w-full">
        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Name</th>
          <td mat-cell *matCellDef="let user" class="px-4 py-2">
            {{user.fullName}}
          </td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Email</th>
          <td mat-cell *matCellDef="let user" class="px-4 py-2">{{user.email}}</td>
        </ng-container>
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">ID</th>
          <td mat-cell *matCellDef="let user" class="px-4 py-2">{{user.id}}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="['fullName','email','id']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['fullName','email','id'];" class="border-b"></tr>
      </table>
    </div>
  </section>

  <!-- Permissions Matrix -->
  <section>
    <h2 class="text-xl font-semibold text-gray-800 mb-2">Permissions</h2>
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="role?.permissions || []" class="min-w-full">
        <ng-container matColumnDef="module">
          <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left">Module</th>
          <td mat-cell *matCellDef="let perm" class="px-4 py-2">{{perm.module}}</td>
        </ng-container>
        <ng-container matColumnDef="view">
          <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-center">View</th>
          <td mat-cell *matCellDef="let perm" class="px-4 py-2 text-center">
            <mat-icon *ngIf="perm.view" color="primary">check_circle</mat-icon>
            <mat-icon *ngIf="!perm.view" color="warn">cancel</mat-icon>
          </td>
        </ng-container>
        <ng-container matColumnDef="create">
          <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-center">Create</th>
          <td mat-cell *matCellDef="let perm" class="px-4 py-2 text-center">
            <mat-icon *ngIf="perm.create" color="primary">check_circle</mat-icon>
            <mat-icon *ngIf="!perm.create" color="warn">cancel</mat-icon>
          </td>
        </ng-container>
        <ng-container matColumnDef="update">
          <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-center">Update</th>
          <td mat-cell *matCellDef="let perm" class="px-4 py-2 text-center">
            <mat-icon *ngIf="perm.update" color="primary">check_circle</mat-icon>
            <mat-icon *ngIf="!perm.update" color="warn">cancel</mat-icon>
          </td>
        </ng-container>
        <ng-container matColumnDef="delete">
          <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-center">Delete</th>
          <td mat-cell *matCellDef="let perm" class="px-4 py-2 text-center">
            <mat-icon *ngIf="perm.delete" color="primary">check_circle</mat-icon>
            <mat-icon *ngIf="!perm.delete" color="warn">cancel</mat-icon>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="border-b"></tr>
      </table>
    </div>
  </section>
</div>
