<h2 mat-dialog-title class="border-b border-gray-100 mb-0 pb-4 flex items-center justify-between">
    <span class="font-semibold text-gray-900">
      {{ data.mode === 'add' ? 'Add Category' : data.mode === 'edit' ? 'Edit Category' : 'Category Details' }}
    </span>
    <button mat-icon-button mat-dialog-close class="text-gray-400">
      <mat-icon>close</mat-icon>
    </button>
  </h2>

  <mat-dialog-content class="pt-6 pb-2">
    
    <!-- View Mode Content -->
    <div *ngIf="data.mode === 'view'" class="space-y-4">
      <div>
        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Category Name</p>
        <p class="text-gray-900 font-medium">{{data.category?.name}}</p>
      </div>
      <div>
        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Category ID</p>
        <p class="text-gray-900">{{data.category?.id}}</p>
      </div>
      <div>
        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Products</p>
        <p class="text-gray-900">{{data.category?.productsCount}}</p>
      </div>
      <div>
        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Status</p>
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
          [ngClass]="data.category?.status === 'Active' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'">
          {{data.category?.status}}
        </span>
      </div>
    </div>

    <!-- Add/Edit Mode Form -->
    <form *ngIf="data.mode !== 'view'" class="flex flex-col gap-4">
      
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Category Name</mat-label>
        <input matInput [ngModel]="data.category?.name" name="name">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Status</mat-label>
        <mat-select [ngModel]="data.category?.status || 'Active'" name="status">
          <mat-option value="Active">Active</mat-option>
          <mat-option value="Inactive">Inactive</mat-option>
        </mat-select>
      </mat-form-field>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="border-t border-gray-100 pt-4 pb-2 px-6">
    
    <ng-container *ngIf="data.mode === 'view'; else editActions">
      <button mat-button mat-dialog-close>Close</button>
      <!-- Mock functionality -> switch to edit mode -->
      <button mat-flat-button color="primary" (click)="data.mode = 'edit'">Edit Category</button>
    </ng-container>

    <ng-template #editActions>
      <button mat-button mat-dialog-close>Cancel</button>
      <button mat-flat-button color="primary" mat-dialog-close>Save Category</button>
    </ng-template>

  </mat-dialog-actions>
