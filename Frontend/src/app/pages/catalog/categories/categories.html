<div class="max-w-7xl mx-auto space-y-6">
      
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 m-0 leading-tight">Categories</h1>
        <p class="text-sm text-gray-500 mt-1">Manage product categories.</p>
      </div>
      <button mat-flat-button color="primary" (click)="openDialog('add')">
        <mat-icon>add</mat-icon>
        Add Category
      </button>
    </div>

    <!-- Toolbar -->
    <mat-card class="!shadow-sm border border-gray-100 !rounded-xl">
      <mat-card-content class="p-4 pb-0 flex flex-col md:flex-row gap-4 items-center">
        
        <mat-form-field appearance="outline" class="w-full md:w-96 m-0" subscriptSizing="dynamic">
          <mat-icon matPrefix class="text-gray-400">search</mat-icon>
          <input matInput placeholder="Search categories..." [(ngModel)]="searchQuery" (input)="filterData()">
        </mat-form-field>

        <!--Will be deleted-->
 <!--       <mat-form-field appearance="outline" class="w-full md:w-48 m-0" subscriptSizing="dynamic">
          <mat-select [(ngModel)]="selectedStatus" (selectionChange)="filterData()">
            <mat-option value="All">All</mat-option>
            <mat-option value="Active">Active</mat-option>
            <mat-option value="Inactive">Inactive</mat-option>
          </mat-select>
        </mat-form-field>-->

      </mat-card-content>
    </mat-card>

    <!-- Categories Table -->
    <mat-card class="!shadow-sm border border-gray-100 !rounded-xl overflow-hidden">
      <div class="overflow-x-auto w-full">
        <table mat-table [dataSource]="filteredCategories" class="w-full min-w-[600px]">
          
          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef class="font-semibold text-gray-600"> Category </th>
            <td mat-cell *matCellDef="let category" class="font-medium text-gray-900"> {{category.Category_Name}} </td>
          </ng-container>

          <ng-container matColumnDef="categoryId">
            <th mat-header-cell *matHeaderCellDef class="font-semibold text-gray-600"> Category ID </th>
            <td mat-cell *matCellDef="let category" class="text-gray-500"> {{category.Category_Id}} </td>
          </ng-container>

          <ng-container matColumnDef="products">
            <th mat-header-cell *matHeaderCellDef class="font-semibold text-gray-600"> Products </th>
            <td mat-cell *matCellDef="let category" class="text-gray-600"> {{ getProductCount(category.Category_Id)}} </td>
          </ng-container>

          <ng-container matColumnDef="Department">
            <th mat-header-cell *matHeaderCellDef class="font-semibold text-gray-600"> Department </th>
            <td mat-cell *matCellDef="let category">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium">
                <!--[ngClass]="Department.Department_Name === 'Active' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'"> -->
                {{category.departmentRef?.Department_Name}}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="w-16"></th>
            <td mat-cell *matCellDef="let category" class="text-right">
              <button mat-icon-button [matMenuTriggerFor]="menu" class="text-gray-400 hover:text-gray-600">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="openDialog('view', category)">
                  <mat-icon>visibility</mat-icon>
                  <span>View</span>
                </button>
                <button mat-menu-item (click)="openDialog('edit', category)">
                  <mat-icon>edit</mat-icon>
                  <span>Edit</span>
                </button>
                <mat-divider></mat-divider>
                <button mat-menu-item class="text-red-600" (click)="deleteCategory(category._id)">
                  <mat-icon class="text-red-500"  >delete</mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors"></tr>
        </table>
        
        <div *ngIf="filteredCategories.length === 0" class="p-8 text-center text-gray-500">
          No categories match your search criteria.
        </div>
      </div>
    </mat-card>
    
    <!-- Bottom padding -->
    <div class="h-4"></div>
  </div>
