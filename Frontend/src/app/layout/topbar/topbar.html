<header class="h-16 flex items-center justify-between bg-white border-b border-gray-200 px-4 shadow-sm z-10 w-full">
  <!-- Left Side -->
  <div class="flex items-center">
    <button (click)="toggleSidebar.emit()" 
      class="p-2 rounded-lg hover:bg-gray-100 transition-colors mr-2 text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <span class="text-lg font-medium text-gray-800">Dashboard</span>
  </div>

  <!-- Right Side -->
  <div class="flex items-center gap-2">
    <!-- Notifications -->
    <button class="p-2 rounded-lg hover:bg-gray-100 transition-colors text-gray-500 relative focus:outline-none focus:ring-2 focus:ring-blue-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
      </svg>
      <span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full"></span>
    </button>

    <!-- User Menu -->
    <div class="relative" (click)="toggleUserMenu()">
      <button class="h-10 rounded-full px-2 ml-2 hover:bg-gray-50 flex items-center focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="flex items-center">
          <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold text-sm mr-3">
            {{ userInitials }}
          </div>
          <div class="hidden sm:flex flex-col items-start leading-tight">
            <span class="text-sm font-semibold text-gray-800 h-4">{{ username }}</span>
            <span class="text-xs text-gray-500">{{roleName }}</span>
          </div>
          <svg class="w-5 h-5 text-gray-400 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
      </button>

      <!-- Dropdown Menu -->
       @if(isUserMenuOpen){
        <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
          <div class="px-4 py-2 border-b border-gray-100">
            <p class="text-sm font-semibold text-gray-800">{{ username }}</p>
            <p class="text-xs text-gray-500">{{ roleName }}</p>
          </div>
          <a routerLink="/profile" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-50 transition-colors text-sm text-gray-700">
           
            Profile
          </a>
          <a routerLink="/settings" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-50 transition-colors text-sm text-gray-700">
           
            Settings
          </a>
          <div class="border-t border-gray-200"></div>
          <button (click)="logout()" class="flex w-full items-center gap-3 px-4 py-2 hover:bg-red-50 transition-colors text-sm text-red-600">
          
            Logout
          </button>
        </div>
         
       }
    </div>
  </div>
</header>
