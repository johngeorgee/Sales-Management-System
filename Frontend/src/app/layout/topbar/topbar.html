<mat-toolbar class="h-16 flex items-center justify-between bg-white border-b border-gray-200 px-4 shadow-sm z-10 w-full" color="default">
    <div class="flex items-center">
      <button mat-icon-button (click)="toggleSidebar.emit()" class="mr-2 text-gray-600">
        <mat-icon>menu</mat-icon>
      </button>
      <!-- The page title could be dynamic, hardcoded to Dashboard for now -->
      <span class="text-lg font-medium text-gray-800">Dashboard</span>
    </div>

    <div class="flex items-center gap-2">
      <button mat-icon-button class="text-gray-500">
        <mat-icon>notifications</mat-icon>
      </button>

      <button mat-button [matMenuTriggerFor]="userMenu" class="h-10 rounded-full px-2 ml-2 hover:bg-gray-50 flex items-center">
        <div class="flex items-center">
          <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold text-sm mr-3">
            JG
          </div>
          <div class="hidden sm:flex flex-col items-start leading-tight">
            <span class="text-sm font-semibold text-gray-800 h-4">John George</span>
            <span class="text-xs text-gray-500">Administrator</span>
          </div>
          <mat-icon class="text-gray-400 ml-1">arrow_drop_down</mat-icon>
        </div>
      </button>
      
      <mat-menu #userMenu="matMenu" xPosition="before">
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <a mat-menu-item routerLink="/login">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </a>
      </mat-menu>
    </div>
  </mat-toolbar>
