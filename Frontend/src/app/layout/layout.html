<mat-sidenav-container class="h-screen bg-gray-50 bg-opacity-50">
      
    <!-- Mobile Sidebar (Drawer) -->
    <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile && sidebarOpen" class="border-none shadow-xl">
      <app-sidebar [isMobile]="isMobile" (close)="sidenav.close()"></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="flex flex-col h-full overflow-hidden relative">
      <app-topbar (toggleSidebar)="toggleSidebar(sidenav)"></app-topbar>
      
      <main class="flex-1 overflow-auto bg-gray-50/50 p-2 sm:p-4 lg:p-6">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>

  </mat-sidenav-container>
