<!-- layout.html -->
<!-- In your parent layout component -->
<app-topbar (toggleSidebar)="toggleSidebar()"></app-topbar>

<div class="flex h-screen">
  <!-- Mobile Overlay -->
  <div 
    *ngIf="isMobile && isSidebarOpen"
    (click)="closeSidebar()"
    class="fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity duration-300"
  ></div>
  
  <!-- Sidebar -->
  <app-sidebar 
    [isMobile]="isMobile"
    (close)="closeSidebar()"
    (toggleSidebar)="toggleSidebar()"
    class="fixed inset-y-0 left-0 z-50 transform transition-transform duration-300 ease-in-out"
    [class.-translate-x-full]="!isSidebarOpen"
    [class.translate-x-0]="isSidebarOpen"
  ></app-sidebar>
  
  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto" [class.ml-64]="!isMobile && isSidebarOpen">
    <router-outlet></router-outlet>
  </main>
</div>
